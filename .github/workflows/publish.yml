name: Publish package

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release type
        required: true
        default: patch
        type: choice
        options: [major, minor, patch, prerelease]
      pre-release-tag:
        description: "Pre-release tag (only for prerelease)"
        required: false
        default: "dev"
        type: string
      dryRun:
        description: "Dry run: verify and pack, but publish nothing and push nothing"
        required: false
        default: false
        type: boolean

# Nothing by default — every job grants only the scopes it needs.
permissions: {}

# Two runs at once would compute the same version and race the registry.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  PACKAGE: "@waterx/sdk"

jobs:
  # Gates first, on a runner that checks out nothing and runs no dependency code.
  guard:
    name: Check publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the actor may cut this release type
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          # GitHub user ids. Official releases are trillionxdev's call alone;
          # allen-hsu may also cut prereleases.
          release_publishers="26142789"            # trillionxdev
          prerelease_publishers="26142789 2819672" # trillionxdev, allen-hsu

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            allowed="$prerelease_publishers"
          else
            allowed="$release_publishers"
          fi

          for id in $allowed; do
            if [ "$id" = "$ACTOR_ID" ]; then
              echo "$ACTOR (id $ACTOR_ID) may cut a '$RELEASE_TYPE'."
              exit 0
            fi
          done

          # Empty/unknown actor ids match nothing, so this fails closed.
          echo "::error::$ACTOR (id $ACTOR_ID) may not cut a '$RELEASE_TYPE'. Allowed user ids: $allowed"
          exit 1

      # A prerelease is meant to be cut off a branch; an official release is not —
      # it publishes to `latest` and pushes the bump back to whatever ref ran it.
      - name: Check an official release is cut from main
        if: ${{ inputs.releaseType != 'prerelease' }}
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a '$RELEASE_TYPE' release must be dispatched from main, not $REF (prereleases may come from any branch)"
            exit 1
          fi

  build:
    name: Verify & build
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # This job installs dependencies and runs their lifecycle scripts.
          # Keep the git credentials off the runner that does that.
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      # A clean install on purpose: a release never restores a node_modules
      # cache that another branch's workflow could have written.
      - run: pnpm install --frozen-lockfile
      # The same bar `ci.yml` holds every PR to. `main` has no required checks,
      # and `ci.yml` only runs on `pull_request`, so this is the gate that
      # actually stands between a commit and the registry.
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      # `dist` is what ships: prove it loads and that the exports map is sound.
      - run: pnpm test:post-build
      - run: pnpm check:exports
      - name: Upload dist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Enable together with the npm-side binding — the OIDC subject changes the
    # moment this line is live, and npm has to be expecting it:
    #   1. repo Settings -> Environments -> "npm-publish": required reviewers
    #      plus a deployment branch rule for `main`;
    #   2. npmjs.com -> @waterx/sdk -> Settings -> Trusted publisher: set
    #      Environment to "npm-publish".
    # environment: npm-publish
    permissions:
      contents: write # push the version bump back to main
      id-token: write # npm trusted publishing (OIDC) + provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # No `pnpm install` in this job: publishing needs no dependencies, and this
      # is the only job holding `id-token: write`.
      - name: Download dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - name: Check the artifact carries the package entry points
        run: |
          set -euo pipefail
          for f in dist/src/sdk.js dist/src/sdk.d.ts dist/cjs/src/sdk.js dist/cjs/package.json; do
            if [ ! -s "$f" ]; then
              echo "::error::built artifact is missing $f"
              exit 1
            fi
          done

      - name: Compute the version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          PRE_RELEASE_TAG: ${{ inputs.pre-release-tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            if [ "$PRE_RELEASE_TAG" = "latest" ]; then
              echo "::error::'latest' is the release dist-tag; a prerelease may not claim it"
              exit 1
            fi
            if ! printf '%s' "$PRE_RELEASE_TAG" | grep -Eq '^[a-z][a-z0-9-]*$'; then
              echo "::error::pre-release tag '$PRE_RELEASE_TAG' must match ^[a-z][a-z0-9-]*\$"
              exit 1
            fi
            # A prerelease bump is deliberately never committed back, so every run
            # reads the last *released* version and `npm version prerelease`
            # restarts the counter at .0 — two prereleases in a row would compute
            # the same version and the second would 403. Take the series npm
            # derived and number it by the run instead: monotonic, never reused.
            npm version prerelease --preid "$PRE_RELEASE_TAG" --no-git-tag-version >/dev/null
            series="$(node -p 'require("./package.json").version.replace(/\.[0-9]+$/, "")')"
            version="$series.$RUN_NUMBER"
            npm version "$version" --no-git-tag-version >/dev/null
            dist_tag="$PRE_RELEASE_TAG"
          else
            version="$(npm version "$RELEASE_TYPE" --no-git-tag-version)"
            version="${version#v}"
            dist_tag="latest"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >>"$GITHUB_OUTPUT"
          echo "$PACKAGE@$version -> dist-tag '$dist_tag'"

      # Fail in seconds rather than after the publish attempt: a 403 from the
      # registry still leaves a provenance statement in the public transparency
      # log for a tarball that never existed.
      - name: Check the version is free
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE@$VERSION is already published — pick a different release type"
            exit 1
          fi
          echo "$PACKAGE@$VERSION is free"

      # Auth is npm trusted publishing over OIDC — there is no npm token. npm
      # matches the claim against the repository AND this workflow's filename,
      # so renaming this file breaks publishing until npmjs.com is updated.
      - name: Publish
        if: ${{ !inputs.dryRun }}
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"

      - name: Publish (dry run)
        if: ${{ inputs.dryRun }}
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --dry-run --access public --ignore-scripts --tag "$DIST_TAG"

      # Releases only. A prerelease bump stays off `main` on purpose — see the
      # version step; the run number, not the repo, carries its counter.
      - name: Commit the version bump
        if: ${{ inputs.releaseType != 'prerelease' && !inputs.dryRun }}
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: bump sdk version to ${{ steps.version.outputs.version }}"
          file_pattern: package.json

      - name: Summarise the release
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          RELEASE_TYPE: ${{ inputs.releaseType }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The registry timestamp CHANGELOG.md dates its sections by, and the
          # commit npm recorded as gitHead (this checkout, one before the bump).
          published_at="$(npm view "$PACKAGE" time --json 2>/dev/null \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[process.env.VERSION] ?? "unknown"' \
            || echo unknown)"
          {
            echo "## $PACKAGE@$VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dist-tag | \`$DIST_TAG\` |"
            echo "| published (UTC) | \`$published_at\` |"
            echo "| published from | \`$COMMIT\` |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_TYPE" != "prerelease" ]; then
            {
              echo
              echo "### By hand next — CLAUDE.md, Release flow steps 2-4"
              echo
              echo '```bash'
              echo "# 2. CHANGELOG.md: [Unreleased] -> [$VERSION] - ${published_at%%T*}, lead with the breaking changes"
              echo "# 3. tag that chore(release) commit"
              echo "git tag -a v$VERSION -m 'v$VERSION — published $published_at from $COMMIT'"
              echo "git push origin v$VERSION"
              echo "# 4. gh release create v$VERSION --title '$VERSION' --notes-file <notes>"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
